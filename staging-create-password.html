<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Create Staging Password | LoadCalcPro</title>
  <style>body{margin:0;font-family:Arial,sans-serif;background:#eef3f7;color:#182433}header{background:#10233f;color:#fff;border-bottom:4px solid #d2a84b;padding:26px}.wrap{width:min(540px,calc(100% - 32px));margin:48px auto}.panel{background:#fff;border:1px solid #d9e1e8;border-radius:16px;padding:28px;box-shadow:0 14px 34px rgba(16,35,63,.12)}h1{color:#10233f}label{display:block;font-weight:700;margin:18px 0 8px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #bcc8d3;border-radius:8px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:#1f8a5b;color:#fff;font-weight:700}button:disabled{opacity:.7;cursor:not-allowed}.message{margin-top:16px;padding:12px;border-radius:8px;background:#eef3f7}.success{background:#ecfdf3;color:#16794f}.error{background:#fff1f0;color:#b42318}.badge{display:inline-block;background:#fff3cd;color:#6d5200;padding:7px 11px;border-radius:999px;font-weight:700}.back{display:block;text-align:center;margin-top:18px;color:#176b47;font-weight:700}</style>
</head>
<body>
<header><strong style="font-size:24px">LoadCalcPro</strong> <span class="badge">STAGING — TEST ONLY</span></header>
<main class="wrap"><section class="panel"><h1>Create or Reset Staging Password</h1><p>Open this page from a staging invitation or recovery email.</p><form id="form"><label for="password">New Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm Password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="button" type="submit" disabled>Checking Secure Link…</button><div id="message" class="message">Verifying your staging invitation or recovery link…</div></form><a class="back" href="staging-member-dashboard.html">Return to Staging Login</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const client=window.supabase.createClient("https://jvnkncpljuaeycwjyeai.supabase.co","sb_publishable_aMerqRsuagFjUU67WWmspA_2uDtn4CF",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const form=document.getElementById("form"),button=document.getElementById("button"),message=document.getElementById("message");let ready=false;
function show(text,type){message.textContent=text;message.className="message "+(type||"")}
function cleanUrl(){history.replaceState({},document.title,location.pathname)}
async function establish(){
  try{
    const query=new URLSearchParams(location.search);
    const hash=new URLSearchParams(location.hash.slice(1));
    const errorDescription=query.get("error_description")||hash.get("error_description");
    if(errorDescription)throw new Error(decodeURIComponent(errorDescription.replace(/\+/g," ")));

    const tokenHash=query.get("token_hash");
    const tokenType=query.get("type");
    const code=query.get("code");
    const accessToken=hash.get("access_token");
    const refreshToken=hash.get("refresh_token");

    if(tokenHash&&tokenType){
      const{error}=await client.auth.verifyOtp({token_hash:tokenHash,type:tokenType});
      if(error)throw error;
      cleanUrl();
    }else if(code){
      const{error}=await client.auth.exchangeCodeForSession(code);
      if(error)throw error;
      cleanUrl();
    }else if(accessToken&&refreshToken){
      const{error}=await client.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
      if(error)throw error;
      cleanUrl();
    }

    const{data,error}=await client.auth.getSession();
    if(error)throw error;
    if(!data.session)throw new Error("This secure link is invalid, expired, or has already been used.");
    ready=true;button.disabled=false;button.textContent="Save Staging Password";show("Secure link verified. Enter your new password.","success");
  }catch(err){ready=false;button.disabled=true;button.textContent="Secure Link Required";show(err.message||"Unable to verify the secure link.","error")}
}
form.addEventListener("submit",async e=>{e.preventDefault();if(!ready)return;const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password.length<8){show("Use at least 8 characters.","error");return}if(password!==confirm){show("The passwords do not match.","error");return}button.disabled=true;button.textContent="Saving…";try{const{error}=await client.auth.updateUser({password});if(error)throw error;show("Password saved. Opening the staging dashboard…","success");setTimeout(()=>location.replace("staging-member-dashboard.html"),1500)}catch(err){show(err.message||"Unable to save the password.","error");button.disabled=false;button.textContent="Save Staging Password"}});
establish();
</script>
</body>
</html>
