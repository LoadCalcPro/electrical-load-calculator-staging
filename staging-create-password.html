<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Create Password | LoadCalcPro X</title>
<meta name="description" content="LoadCalcPro X professional electrical calculation suite.">
<link rel="stylesheet" href="brand.css">
<style>:root{--navy:#0f172a;--blue:#1e3a8a;--teal:#0f766e;--page:#f3f4f6;--text:#111827;--muted:#6b7280;--border:#d1d5db}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--page);color:var(--text)}.wrap{width:min(540px,calc(100% - 32px));margin:48px auto}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 4px 16px rgba(15,23,42,.08)}h1{color:var(--blue)}label{display:block;font-weight:700;margin:18px 0 8px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.secondary{background:var(--blue)}.message{display:none;margin-top:16px;padding:12px;border-radius:8px}.success{display:block;background:#ecfdf3;color:#16794f}.error{display:block;background:#fff1f0;color:#b42318}.info{display:block;background:#eef2f7;color:#111827}.back{display:block;text-align:center;margin-top:18px;color:var(--teal);font-weight:800}.hidden{display:none}.code{letter-spacing:.35em;text-align:center;font-size:22px;font-weight:700}.site-footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 28px}</style>
</head>
<body>
<header class="lcp-brand-header"><div class="lcp-brand-wrap"><div><div class="lcp-wordmark medium"><span class="bolt">⚡</span>LoadCalcPro<span class="brand-x">X</span></div><div class="lcp-subtitle">Professional Electrical Calculation Suite</div></div></div></header>
<main class="wrap"><section class="panel"><h1>Create or Reset Your Password</h1><p>Use the same email address used for your LoadCalcPro X membership.</p><section id="emailStep"><label for="email">Membership Email</label><input id="email" type="email" autocomplete="email" required><button id="sendCode" type="button">Send My 6-Digit Code</button></section><form id="passwordStep" class="hidden"><p>A six-digit verification code was sent to <strong id="sentTo"></strong>.</p><label for="code">Verification Code</label><input id="code" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required><label for="password">New Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Confirm Password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button id="savePassword" type="submit">Verify Code and Save Password</button><button id="resendCode" class="secondary" type="button">Resend Code</button></form><div id="message" class="message"></div><a class="back" href="staging-member-dashboard.html">Return to Login</a></section></main>
<footer class="site-footer">© LoadCalcPro X. All rights reserved.<br>Version 1.0.0</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>"use strict";const SUPABASE_URL="https://jvnkncpljuaeycwjyeai.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_aMerqRsuagFjUU67WWmspA_2uDtn4CF";const API_BASE_URL="https://loadcalcpro-hcml-api-staging.onrender.com";const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const emailStep=document.getElementById("emailStep"),passwordStep=document.getElementById("passwordStep"),emailInput=document.getElementById("email"),sendCode=document.getElementById("sendCode"),resendCode=document.getElementById("resendCode"),savePassword=document.getElementById("savePassword"),message=document.getElementById("message");let verifiedEmail="";function show(text,type){message.textContent=text;message.className="message "+(type||"info")}function cleanEmail(){return emailInput.value.trim().toLowerCase()}async function membershipIsActive(email){const response=await fetch(API_BASE_URL+"/api/access",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});let data={};try{data=await response.json()}catch{}if(!response.ok||data.active!==true)throw new Error(data.message||"No active membership was found for this email.");return data}async function requestCode(){const email=cleanEmail();if(!email){show("Enter the email address used for your membership.","error");return}sendCode.disabled=true;resendCode.disabled=true;show("Checking your membership…","info");try{await membershipIsActive(email);const{error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)throw error;verifiedEmail=email;document.getElementById("sentTo").textContent=email;emailStep.classList.add("hidden");passwordStep.classList.remove("hidden");show("Code sent. Check your inbox and Spam or Junk folder.","success");document.getElementById("code").focus()}catch(err){show(err.message||"Unable to send the verification code.","error")}finally{sendCode.disabled=false;resendCode.disabled=false}}sendCode.addEventListener("click",requestCode);resendCode.addEventListener("click",requestCode);passwordStep.addEventListener("submit",async e=>{e.preventDefault();const token=document.getElementById("code").value.trim(),password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(!/^\d{6}$/.test(token)){show("Enter the six-digit code from your email.","error");return}if(password.length<8){show("Use a password with at least 8 characters.","error");return}if(password!==confirm){show("The passwords do not match.","error");return}savePassword.disabled=true;savePassword.textContent="Verifying…";try{const{data,error}=await client.auth.verifyOtp({email:verifiedEmail,token,type:"email"});if(error)throw error;if(!data.session)throw new Error("The code could not create a secure session.");const result=await client.auth.updateUser({password});if(result.error)throw result.error;show("Password saved. Opening your member dashboard…","success");setTimeout(()=>location.replace("staging-member-dashboard.html"),1200)}catch(err){show(err.message||"The code is incorrect or has expired.","error");savePassword.disabled=false;savePassword.textContent="Verify Code and Save Password"}});</script>
</body></html>
