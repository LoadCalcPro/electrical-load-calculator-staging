<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Staging Password Recovery | LoadCalcPro</title>
  <style>body{margin:0;font-family:Arial,sans-serif;background:#eef3f7;color:#182433}header{background:#10233f;color:#fff;border-bottom:4px solid #d2a84b;padding:26px}.wrap{width:min(540px,calc(100% - 32px));margin:48px auto}.panel{background:#fff;border:1px solid #d9e1e8;border-radius:16px;padding:28px;box-shadow:0 14px 34px rgba(16,35,63,.12)}h1{color:#10233f}label{display:block;font-weight:700;margin:18px 0 8px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #bcc8d3;border-radius:8px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:#1f8a5b;color:#fff;font-weight:700}.message{display:none;margin-top:16px;padding:12px;border-radius:8px}.success{display:block;background:#ecfdf3;color:#16794f}.error{display:block;background:#fff1f0;color:#b42318}.badge{display:inline-block;background:#fff3cd;color:#6d5200;padding:7px 11px;border-radius:999px;font-weight:700}.back{display:block;text-align:center;margin-top:18px;color:#176b47;font-weight:700}</style>
</head>
<body>
<header><strong style="font-size:24px">LoadCalcPro</strong> <span class="badge">STAGING — TEST ONLY</span></header>
<main class="wrap"><section class="panel"><h1>Recover Staging Password</h1><p>This sends a recovery email from the staging Supabase project only.</p><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><button id="button" type="submit">Send Staging Recovery Email</button><div id="message" class="message"></div></form><a class="back" href="staging-member-dashboard.html">Return to Staging Login</a></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const client=window.supabase.createClient("https://jvnkncpljuaeycwjyeai.supabase.co","sb_publishable_aMerqRsuagFjUU67WWmspA_2uDtn4CF",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById("form"),button=document.getElementById("button"),message=document.getElementById("message");
form.addEventListener("submit",async e=>{e.preventDefault();message.className="message";button.disabled=true;button.textContent="Sending…";try{const email=document.getElementById("email").value.trim().toLowerCase();const redirectTo=new URL("staging-create-password.html",window.location.href).href;const{error}=await client.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;message.textContent="Recovery email sent. Open the newest message and use its secure link.";message.className="message success"}catch(err){message.textContent=err.message||"Unable to send the recovery email.";message.className="message error"}finally{button.disabled=false;button.textContent="Send Staging Recovery Email"}});
</script>
</body>
</html>
