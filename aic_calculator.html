pplication/json",Authorization:"Bearer "+data.session.access_token},body:JSON.stringify({calculator:"aic"})});const result=await r.json().catch(()=>({}));if(!r.ok||result.active!==true)throw new Error(result.message||"AIC access was not approved.");statusBox.textContent="Success: staging authentication and AIC membership access were both verified.";statusBox.className="status success"}catch(err){statusBox.textContent=err.message||"Unable to verify access.";statusBox.className="status error"}})();</script></body></html>
