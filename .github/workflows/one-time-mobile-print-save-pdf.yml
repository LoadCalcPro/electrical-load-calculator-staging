name: One-time mobile print and PDF fix

on:
  push:
    paths:
      - '.github/workflows/one-time-mobile-print-save-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update AIC mobile print behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('aic_calculator.html')
          text = path.read_text(encoding='utf-8')

          text, button_count = re.subn(
              r'(<button\s+type="button"\s+class="no-print"\s+onclick="preparePrint\(\)">)(?:Print|Print / Save PDF)(</button>)',
              r'\1Print / Save PDF\2',
              text,
              count=1,
          )
          if button_count != 1:
              raise SystemExit(f'Expected one print button, changed {button_count}.')

          listener_pattern = re.compile(
              r"select\.addEventListener\('change',\s*\(\)\s*=>\s*(?:localStorage\.setItem\(PRINT_LAYOUT_KEY,\s*select\.value\)|\{.*?\})\s*\);",
              re.S,
          )
          listener_replacement = """select.addEventListener('change', () => {
    localStorage.setItem(PRINT_LAYOUT_KEY, select.value);
    removePrintPages();
  });"""
          text, listener_count = listener_pattern.subn(listener_replacement, text, count=1)
          if listener_count != 1:
              raise SystemExit(f'Expected one print-layout listener, changed {listener_count}.')

          start = text.find('function preparePrint() {')
          if start == -1:
              raise SystemExit('preparePrint function was not found.')
          end_marker = '\n}\n\n\n\nfunction saveCurrentValues()'
          end = text.find(end_marker, start)
          if end == -1:
              end_marker = '\n}\n\nfunction saveCurrentValues()'
              end = text.find(end_marker, start)
          if end == -1:
              raise SystemExit('Could not locate the end of preparePrint.')
          end += 2

          replacement = """let printInProgress = false;
let printCleanupTimer = null;

function finishPrintCleanup() {
  removePrintPages();
  printInProgress = false;
  if (printCleanupTimer) {
    clearTimeout(printCleanupTimer);
    printCleanupTimer = null;
  }
}

window.addEventListener('afterprint', finishPrintCleanup);

function preparePrint() {
  if (printInProgress) return;

  buildCleanPrintReports();
  const layout = selectedPrintLayout();
  localStorage.setItem(PRINT_LAYOUT_KEY, String(layout));
  const reportCount = createPrintPages(layout);
  if (!reportCount) {
    alert('Enter calculation information before printing.');
    return;
  }

  printInProgress = true;
  window.print();
  printCleanupTimer = setTimeout(finishPrintCleanup, 60000);
}"""

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit calculator update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          if git diff --cached --quiet; then
            echo "No calculator changes needed."
          else
            git commit -m "Fix AIC mobile printing and add Save PDF label"
            git push
          fi
