name: One-time mobile print and PDF fix

on:
  push:
    paths:
      - '.github/workflows/one-time-mobile-print-save-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update AIC mobile print behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('aic_calculator.html')
          text = path.read_text(encoding='utf-8')

          # Rename only the visible print button.
          text = text.replace(
              'onclick="preparePrint()">Print</button>',
              'onclick="preparePrint()">Print / Save PDF</button>',
              1,
          )

          # Changing layout should only save the preference; it must never print.
          text = re.sub(
              r"select\.addEventListener\('change',\s*\(\)\s*=>\s*localStorage\.setItem\(PRINT_LAYOUT_KEY,\s*select\.value\)\s*\);",
              "select.addEventListener('change', () => {\n    localStorage.setItem(PRINT_LAYOUT_KEY, select.value);\n    removePrintPages();\n  });",
              text,
              count=1,
          )

          # Replace the current preparePrint block by locating the next function.
          start = text.find('function preparePrint() {')
          next_function = text.find('function saveCurrentValues()', start)
          if start == -1 or next_function == -1:
              raise SystemExit('Could not locate the print function block.')

          replacement = """let printInProgress = false;
let printCleanupTimer = null;

function finishPrintCleanup() {
  removePrintPages();
  printInProgress = false;
  if (printCleanupTimer) {
    clearTimeout(printCleanupTimer);
    printCleanupTimer = null;
  }
}

window.addEventListener('afterprint', finishPrintCleanup);

function preparePrint() {
  if (printInProgress) return;

  buildCleanPrintReports();
  const layout = selectedPrintLayout();
  localStorage.setItem(PRINT_LAYOUT_KEY, String(layout));
  const reportCount = createPrintPages(layout);
  if (!reportCount) {
    alert('Enter calculation information before printing.');
    return;
  }

  printInProgress = true;
  window.print();
  printCleanupTimer = setTimeout(finishPrintCleanup, 60000);
}


"""

          text = text[:start] + replacement + text[next_function:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit calculator update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          if git diff --cached --quiet; then
            echo "No calculator changes needed."
          else
            git commit -m "Fix AIC mobile printing and add Save PDF label"
            git push
          fi