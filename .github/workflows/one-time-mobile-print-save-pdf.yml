name: Apply direct AIC mobile print fix

on:
  push:
    paths:
      - '.github/workflows/one-time-mobile-print-save-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update AIC calculator file directly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('aic_calculator.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<button type="button" class="no-print" onclick="preparePrint()">Print</button>',
              '<button type="button" class="no-print" onclick="preparePrint()">Print / Save PDF</button>',
              1,
          )

          text = text.replace(
              "  select.addEventListener('change', () => localStorage.setItem(PRINT_LAYOUT_KEY, select.value));",
              "  select.addEventListener('change', () => {\n    localStorage.setItem(PRINT_LAYOUT_KEY, select.value);\n    removePrintPages();\n  });",
              1,
          )

          old_prepare = '''function preparePrint() {
            buildCleanPrintReports();
            const layout = selectedPrintLayout();
            localStorage.setItem(PRINT_LAYOUT_KEY, String(layout));
            const reportCount = createPrintPages(layout);
            if (!reportCount) {
              alert('Enter calculation information before printing.');
              return;
            }
            window.print();
            setTimeout(removePrintPages, 500);
          }'''.replace('          ', '')

          new_prepare = '''let printInProgress = false;
          let printCleanupTimer = null;

          function finishPrintCleanup() {
            removePrintPages();
            printInProgress = false;
            if (printCleanupTimer) {
              clearTimeout(printCleanupTimer);
              printCleanupTimer = null;
            }
          }

          window.addEventListener('afterprint', finishPrintCleanup);

          function preparePrint() {
            if (printInProgress) return;

            buildCleanPrintReports();
            const layout = selectedPrintLayout();
            localStorage.setItem(PRINT_LAYOUT_KEY, String(layout));
            const reportCount = createPrintPages(layout);
            if (!reportCount) {
              alert('Enter calculation information before printing.');
              return;
            }

            printInProgress = true;
            window.print();
            printCleanupTimer = setTimeout(finishPrintCleanup, 60000);
          }'''.replace('          ', '')

          if old_prepare not in text:
              raise SystemExit('Original preparePrint function not found.')

          text = text.replace(old_prepare, new_prepare, 1)
          text = text.replace(
              '  updatePanelControls();  restorePrintLayout();  restorePrintLayout();',
              '  updatePanelControls();',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit calculator update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          git commit -m "Fix AIC mobile printing and Save PDF behavior"
          git push
