name: Drawing Suite Browser Smoke
on:
  push:
    branches: [main]
    paths:
      - 'one-line/index.html'
      - 'tests/drawing-smoke.cjs'
      - '.github/workflows/drawing-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline editor JavaScript syntax before browser setup
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('one-line/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw Error('No inline editor scripts found');
          scripts.forEach((match, i) => {
            try { new vm.Script(match[1], {filename: 'one-line/index.html (script ' + (i+1) + ')'}); }
            catch (error) { console.error('Inline script ' + (i+1) + ' has invalid JavaScript:', error); process.exitCode = 1; }
          });
          if (!process.exitCode) console.log('All ' + scripts.length + ' inline editor scripts passed syntax validation.');
          NODE
      - run: npm install --no-save playwright
      - name: Install Chromium with bounded runtime
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Run all Drawing Suite and clipboard browser checks
        id: browser_tests
        timeout-minutes: 10
        run: node tests/drawing-smoke.cjs
      - name: Publish test result to GitHub Actions summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.browser_tests.outcome }}
        run: |
          echo '## Drawing Suite and clipboard browser verification' >> "$GITHUB_STEP_SUMMARY"
          echo "Chromium smoke suite: **$TEST_OUTCOME**" >> "$GITHUB_STEP_SUMMARY"
          echo 'Includes clipboard image/text paste, image resize, drawing-tab isolation, project Save/Open, and image removal.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f test-results/failure.txt ]; then
            echo '### Failure details' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            head -c 12000 test-results/failure.txt >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drawing-smoke-failure
          path: test-results/
          if-no-files-found: ignore
