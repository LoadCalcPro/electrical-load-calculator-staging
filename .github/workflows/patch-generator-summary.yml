name: Patch Generator Summary Layout

on:
  push:
    paths:
      - '.github/workflows/patch-generator-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply summary layout changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('generator/index.html')
          css = Path('generator/mobile-managed-46.css')
          js = Path('generator/summary-layout-fix.js')

          html = index.read_text(encoding='utf-8')

          old_insert = '''<button id="mq42" class="managed-qty" type="button" aria-label="Reduce managed quantity">0</button>\n</div>\n</div>\n</div>\n\n<div class="summary-strip">'''
          new_insert = '''<button id="mq42" class="managed-qty" type="button" aria-label="Reduce managed quantity">0</button>\n</div>\n</div>\n</div>\n\n<div class="calculation-summary" aria-label="Final calculation summary">\n<div class="calculation-summary-row">\n<span>Service Load:</span>\n<span><span id="calcSummaryServiceVA">0</span> VA</span>\n</div>\n<div class="calculation-summary-row">\n<span>Generator Load:</span>\n<span><span id="calcSummaryGeneratorVA">0</span> VA</span>\n</div>\n<div class="calculation-summary-row">\n<span>Managed Quantity:</span>\n<span id="bottomManagedLoadCount">0</span>\n</div>\n</div>\n\n<div class="summary-strip">'''
          if old_insert not in html:
              raise SystemExit('Could not find Additional Continuous Load insertion point')
          html = html.replace(old_insert, new_insert, 1)

          old_generator = '''<div class="total-managed-line">\n<span id="generatorTotalVAView">0</span> VA\n&nbsp;•&nbsp;\nManaged Loads:\n<span id="bottomManagedLoadCount">0</span>\n</div>'''
          new_generator = '''<div class="total-managed-line">\n<span id="generatorTotalVAView">0</span> VA\n</div>'''
          if old_generator not in html:
              raise SystemExit('Could not find fixed Generator managed line')
          html = html.replace(old_generator, new_generator, 1)

          old_scripts = '''<script src="script.js"></script>\n<script src="cooling-managed-fix.js"></script>'''
          new_scripts = '''<script src="script.js"></script>\n<script src="cooling-managed-fix.js"></script>\n<script src="summary-layout-fix.js"></script>'''
          if old_scripts not in html:
              raise SystemExit('Could not find script include block')
          html = html.replace(old_scripts, new_scripts, 1)
          index.write_text(html, encoding='utf-8')

          css_text = css.read_text(encoding='utf-8')
          marker = '  /* Bottom summary managed-load text. */'
          summary_css = '''  /* Final calculation summary below Additional Continuous Load. */\n  .calculation-summary{\n    margin-top:16px!important;\n    padding-top:14px!important;\n    border-top:1px solid #dbe4ee!important;\n    font-size:16px!important;\n    line-height:1.45!important;\n    color:#0f172a!important;\n  }\n\n  .calculation-summary-row{\n    display:flex!important;\n    align-items:baseline!important;\n    justify-content:space-between!important;\n    gap:16px!important;\n    padding:4px 0!important;\n    font-size:16px!important;\n    font-weight:400!important;\n  }\n\n'''
          if summary_css.strip() not in css_text:
              if marker not in css_text:
                  raise SystemExit('Could not find CSS insertion marker')
              css_text = css_text.replace(marker, summary_css + marker, 1)
          css.write_text(css_text, encoding='utf-8')

          js.write_text('''(function(){\n  "use strict";\n\n  function syncSummaryValues(){\n    const serviceSource = document.getElementById("serviceTotalVAView");\n    const generatorSource = document.getElementById("generatorTotalVAView");\n    const serviceTarget = document.getElementById("calcSummaryServiceVA");\n    const generatorTarget = document.getElementById("calcSummaryGeneratorVA");\n\n    if(serviceSource && serviceTarget){\n      serviceTarget.textContent = serviceSource.textContent || "0";\n    }\n\n    if(generatorSource && generatorTarget){\n      generatorTarget.textContent = generatorSource.textContent || "0";\n    }\n  }\n\n  function watch(source){\n    if(!source){\n      return;\n    }\n\n    new MutationObserver(syncSummaryValues).observe(source,{\n      childList:true,\n      characterData:true,\n      subtree:true\n    });\n  }\n\n  function init(){\n    syncSummaryValues();\n    watch(document.getElementById("serviceTotalVAView"));\n    watch(document.getElementById("generatorTotalVAView"));\n  }\n\n  if(document.readyState === "loading"){\n    document.addEventListener("DOMContentLoaded",init,{once:true});\n  }else{\n    init();\n  }\n})();\n''', encoding='utf-8')
          PY

      - name: Commit patched generator files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator/index.html generator/mobile-managed-46.css generator/summary-layout-fix.js
          git rm .github/workflows/patch-generator-summary.yml
          git commit -m "Refine generator summary and fixed load boxes"
          git push
