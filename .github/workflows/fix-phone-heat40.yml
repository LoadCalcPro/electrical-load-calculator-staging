name: Fix phone Heat at 40 percent logic

on:
  push:
    paths:
      - '.github/workflows/fix-phone-heat40.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep the 40 percent method for partial generator heating quantities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          old = """    const generatorHeating = heatDemand(generatorHeatTotal, generatorHeatQty);"""
          new = """    // Match the regular generator calculator: once the entered service
    // heating group qualifies for the 40% method, keep that same method
    // while managed quantities reduce the generator heating load.
    const generatorHeating = serviceHeatQty >= 4
      ? generatorHeatTotal * 0.40
      : heatDemand(generatorHeatTotal, generatorHeatQty);"""

          if old not in text:
              raise SystemExit('Expected generator heating line was not found; no change made.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/fix-phone-heat40.yml')
          workflow.unlink()
          PY

      - name: Commit the correction
        run: |
          git config user.name 'LoadCalcPro Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add generator-phone-staging-v1.0.html .github/workflows/fix-phone-heat40.yml
          git commit -m 'Fix phone partial Heat at 40 percent calculation'
          git push
