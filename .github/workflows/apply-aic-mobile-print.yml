name: Apply staging AIC mobile and print layout

on:
  push:
    paths:
      - '.github/workflows/apply-aic-mobile-print.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply responsive and print-only presentation changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('aic_calculator.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* AIC MOBILE PRINT V1 */'

          if marker in text:
              print('AIC mobile/print styling is already present.')
              raise SystemExit(0)

          css = r'''

    /* AIC MOBILE PRINT V1 */
    .print-report-header { display:none; }

    @media (max-width: 700px) {
      body { background:#eef2f6; }
      .page { width:100%; margin:0; padding:12px; }
      main { padding:0; }
      .form-titlebar { grid-template-columns:1fr; gap:10px; padding:4px 2px 0; }
      .title-actions { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .title-actions .form-brand { grid-column:1 / -1; grid-row:1; text-align:left; font-size:14px; }
      .title-actions button { width:100%; min-height:46px; margin:0!important; font-size:15px; }
      .card { padding:15px; border-radius:12px; }
      .calc-heading-row { display:grid; grid-template-columns:1fr; gap:9px; margin-bottom:14px; }
      .calc-heading-input { width:100%; max-width:none; min-height:46px; font-size:16px; }
      .form-grid { grid-template-columns:1fr; gap:6px; }
      .form-grid label { margin-top:8px; font-size:15px; }
      input, select { min-height:48px; font-size:16px; padding:11px 12px; }
      .result { grid-template-columns:1fr 1fr; gap:9px; }
      .metric { padding:13px; }
      .metric .value { font-size:23px; }
      .formula { font-size:14px; overflow-wrap:anywhere; }
      .button-row, .panel-controls { display:grid; grid-template-columns:1fr; }
      .button-row button, .panel-controls button { width:100%; min-height:46px; font-size:15px; }
    }

    @media (max-width: 390px) {
      .page { padding:9px; }
      .card { padding:12px; }
      .result { grid-template-columns:1fr; }
      .form-title { font-size:14px; }
    }

    @media print {
      @page { size:letter portrait; margin:.35in; }
      html, body { width:100%; background:#fff!important; }
      body { zoom:1; }
      .page { width:100%; max-width:none; margin:0; padding:0; }
      .print-report-header { display:grid!important; grid-template-columns:1fr auto; align-items:end; gap:18px; padding:0 0 8px; margin:0 0 10px; border-bottom:2px solid #1e3a8a; }
      .print-report-brand { color:#1e3a8a; font-size:19px; font-weight:800; }
      .print-report-title { margin-top:2px; color:#111827; font-size:13px; font-weight:700; }
      .print-report-date { color:#475569; font-size:9px; white-space:nowrap; }
      .form-titlebar { display:none!important; }
      .grid { display:block; }
      .card { border:1px solid #aebdca; border-radius:5px; padding:9px 11px; margin:0 0 8px; box-shadow:none; break-inside:avoid; page-break-inside:avoid; }
      .panel-number { font-size:9px; margin-bottom:3px; color:#475569; }
      .calc-heading-row { display:grid; grid-template-columns:auto minmax(190px, 1fr); align-items:center; gap:10px; margin:0 0 6px; }
      h2 { font-size:13px; }
      .calc-heading-input, input, select { display:block!important; width:100%!important; min-height:22px; padding:3px 6px!important; margin:0!important; border:1px solid #6f8294!important; border-radius:2px!important; background:#fff!important; color:#111827!important; font-size:9.5px!important; line-height:1.25!important; opacity:1!important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      select { appearance:auto!important; -webkit-appearance:menulist!important; }
      input::placeholder { color:transparent!important; }
      .form-grid { display:grid!important; grid-template-columns:1.35fr 1fr 1.35fr 1fr; gap:4px 8px; align-items:center; }
      .form-grid label { font-size:9px; line-height:1.15; }
      .result { grid-template-columns:1fr 1fr; gap:7px; margin-top:7px; }
      .metric { padding:5px 7px; border-radius:3px; }
      .metric .label { font-size:7.5px; }
      .metric .value { font-size:14px; margin-top:1px; }
      .formula { padding:5px 7px; margin-top:6px; font-size:9px; line-height:1.25; border-radius:3px; }
      .formula-title { font-size:10px; margin-bottom:2px; }
      .formula-line { grid-template-columns:34px 14px auto; }
      .no-print, button, .button-row, .panel-controls, .note, #accessGate, .restore-modal, .logout-button { display:none!important; }
    }
'''

          header = '''
    <div class="print-report-header" aria-hidden="true">
      <div>
        <div class="print-report-brand">⚡ LoadCalcPro<span class="brand-x">X</span></div>
        <div class="print-report-title">Available Fault Current Calculation Report</div>
      </div>
      <div class="print-report-date" id="printReportDate"></div>
    </div>
'''

          script = r'''
<script>
(function addAicPrintDate(){
  function updatePrintDate(){
    const node=document.getElementById('printReportDate');
    if(node){
      node.textContent='Prepared: '+new Date().toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
    }
  }
  window.addEventListener('beforeprint',updatePrintDate);
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',updatePrintDate);
  }else{
    updatePrintDate();
  }
})();
</script>
'''

          text = text.replace('</style>', css + '\n</style>', 1)
          text = text.replace('  <div class="page">', '  <div class="page">\n' + header, 1)
          text = text.replace('</body>', script + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('Applied staging-only AIC mobile and print presentation changes.')
          PY
      - name: Commit staging change
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          git commit -m "Improve staging AIC mobile and print layout"
          git push

# Triggered after workflow was added to the default branch.
