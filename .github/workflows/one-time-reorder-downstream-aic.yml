name: One-time downstream AIC field reorder

on:
  push:
    paths:
      - '.github/workflows/one-time-reorder-downstream-aic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder downstream AIC fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('aic_calculator.html')
          text = path.read_text(encoding='utf-8')

          start = text.index('function createPanel(n) {')
          end = text.index('function attachPanelEvents(n) {', start)
          block = text[start:end]

          fault_pattern = re.compile(
              r'\n\s*<label for="utilityFault\$\{n\}">I = Fault Current</label>\n'
              r'\s*<input id="utilityFault\$\{n\}" type="text" inputmode="decimal"\n'
              r'\s*placeholder="\$\{n === 2 \? \'Fault current from first calculation\' : \'Enter fault current\'\}">\n',
              re.M,
          )
          match = fault_pattern.search(block)
          if not match:
              raise SystemExit('Downstream fault-current field block not found.')

          fault_block = match.group(0)
          block = block[:match.start()] + '\n' + block[match.end():]

          grid_marker = '    <div class="form-grid">\n'
          grid_pos = block.index(grid_marker) + len(grid_marker)
          block = block[:grid_pos] + fault_block + block[grid_pos:]

          block = block.replace('L = Distance to panel', 'L = Distance to Panel')
          block = block.replace('E = Volts', 'E = Voltage')
          block = block.replace('N = Number of conductors per phase', 'N = Number of Conductors per Phase')

          updated = text[:start] + block + text[end:]
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit calculator update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          if git diff --cached --quiet; then
            echo "No calculator change was needed."
          else
            git commit -m "Move downstream fault current to top of AIC inputs"
            git push
          fi
