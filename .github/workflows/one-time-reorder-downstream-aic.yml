name: One-time downstream AIC field reorder

on:
  push:
    paths:
      - '.github/workflows/one-time-reorder-downstream-aic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder downstream AIC fields
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('aic_calculator.html')
          text = path.read_text(encoding='utf-8')

          start = text.index('function createPanel(n) {')
          end = text.index('function attachPanelEvents(n) {')
          block = text[start:end]

          fault = '''      <label for="utilityFault${n}">I = Fault Current</label>
      <input id="utilityFault${n}" type="text" inputmode="decimal"
        placeholder="${n === 2 ? 'Fault current from first calculation' : 'Enter fault current'}">

'''
          if fault not in block:
              raise SystemExit('Downstream fault-current block not found.')

          block = block.replace(fault, '', 1)
          marker = '    <div class="form-grid">\n\n'
          if marker not in block:
              raise SystemExit('Downstream form-grid marker not found.')

          block = block.replace(marker, marker + fault, 1)
          block = block.replace('L = Distance to panel', 'L = Distance to Panel')
          block = block.replace('E = Volts', 'E = Voltage')
          block = block.replace('N = Number of conductors per phase', 'N = Number of Conductors per Phase')

          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit calculator change and remove this workflow
        run: |
          rm .github/workflows/one-time-reorder-downstream-aic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html .github/workflows/one-time-reorder-downstream-aic.yml
          git commit -m "Move downstream fault current to top of AIC inputs"
          git push
