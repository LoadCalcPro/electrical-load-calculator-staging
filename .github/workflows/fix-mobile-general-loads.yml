name: Fix mobile general loads

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-general-loads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simplify General Loads section
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          # Update the three row headings so the fixed VA values are visible in the labels.
          text = text.replace(
              '''<div class="load-name">
            Square Footage
          </div>''',
              '''<div class="load-name">
            Square Footage at 3 VA/ft²
          </div>''',
              1,
          )
          text = text.replace(
              '''<div class="load-name">
            Small Appliance Circuits
          </div>''',
              '''<div class="load-name">
            Small Appliance Circuits at 1,500 VA each
          </div>''',
              1,
          )
          text = text.replace(
              '''<div class="load-name">
            Laundry Circuit
          </div>''',
              '''<div class="load-name">
            Laundry Circuit at 1,500 VA each
          </div>''',
              1,
          )

          # Remove the fixed-value input blocks. The calculation already uses constants.
          for field_id in ('v5', 'v6', 'v7'):
              pattern = rf'''\n\s*<div class="input-block">\s*<label for="{field_id}">.*?</label>\s*<input\s+id="{field_id}".*?>\s*</div>'''
              text, count = re.subn(pattern, '', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not remove {field_id} input block')

          # Make each remaining General Loads input use the full row width.
          general_start = text.index('<h2 class="card-heading">\n        General Loads')
          appliance_start = text.index('<h2 class="card-heading">\n        Appliance Loads')
          before = text[:general_start]
          general = text[general_start:appliance_start]
          after = text[appliance_start:]
          general = general.replace('class="load-inputs"', 'class="load-inputs general-load-inputs"')
          text = before + general + after

          # Remove the duplicated General VA summary strip.
          summary_pattern = r'''\n\s*<div class="summary-strip">\s*<div class="summary-box">\s*<div class="summary-label">\s*Service General VA\s*</div>.*?id="f8".*?</div>\s*</div>\s*</div>'''
          text, count = re.subn(summary_pattern, '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not remove General VA summary strip')

          # Add a focused layout rule for the single remaining input in each General Loads row.
          marker = '''.load-inputs{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:9px;
}
'''
          addition = marker + '''\n.general-load-inputs{\n  grid-template-columns:1fr;\n}\n'''
          if '.general-load-inputs{' not in text:
              if marker not in text:
                  raise SystemExit('Could not find load-inputs CSS rule')
              text = text.replace(marker, addition, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Simplify mobile General Loads section"
            git push
          fi
