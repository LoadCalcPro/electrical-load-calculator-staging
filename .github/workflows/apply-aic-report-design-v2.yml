name: Apply staging AIC report design v2

on:
  push:
    paths:
      - '.github/workflows/apply-aic-report-design-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update staging AIC report and mobile layout
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/update_aic.py
          python /tmp/update_aic.py
      - name: Commit staging AIC update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          git commit -m "Create staging AIC report design v2"
          git push
