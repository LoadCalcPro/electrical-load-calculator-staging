name: Remove NEC year from staging AIC

on:
  push:
    paths:
      - '.github/workflows/remove-nec-year-from-aic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove NEC year from AIC heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('aic_calculator.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('NEC 2023 | Version 1.0', 'Version 1.0')
          text = text.replace('NEC 2023', '')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          git commit -m "Remove NEC year from staging AIC"
          git push
