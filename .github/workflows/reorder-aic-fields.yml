name: Reorder AIC input fields

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/reorder_aic_fields.py'
      - '.github/workflows/reorder-aic-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder AIC fields
        run: python .github/scripts/reorder_aic_fields.py
      - name: Commit updated calculator
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          git commit -m "Move utility fault current to top of AIC inputs"
          git push
