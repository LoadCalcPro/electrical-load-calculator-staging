name: Apply streamlined phone HVAC fix

on:
  push:
    paths:
      - '.github/workflows/apply-nec-hvac-selector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-phone-calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply one unified phone HVAC calculation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          old_note = '''        <p class="section-note">
          The calculator uses the larger of the air-conditioning
          load or the calculated heating load. Four or more heating
          units are calculated at 40 percent.
        </p>'''

          selector = '''        <p class="section-note">
          Select the heating system type. The calculator will use one
          HVAC method only and compare it with the air-conditioning load
          when the selected method requires a comparison.
        </p>

        <div class="heating-type-selector" role="radiogroup" aria-label="Heating system type">
          <button type="button" class="heating-type-choice" data-heating-type="central" role="radio" aria-checked="true" onclick="setHeatingType('central')">
            <span class="heating-type-check">✓</span>
            <span>Central Electric Heat</span>
          </button>
          <button type="button" class="heating-type-choice" data-heating-type="space" role="radio" aria-checked="false" onclick="setHeatingType('space')">
            <span class="heating-type-check"></span>
            <span>Electric Space-Heating Units</span>
          </button>
          <button type="button" class="heating-type-choice" data-heating-type="heatpump" role="radio" aria-checked="false" onclick="setHeatingType('heatpump')">
            <span class="heating-type-check"></span>
            <span>Heat Pump with Supplemental Heat</span>
          </button>
        </div>

        <div id="hvacMethodUsed" class="hvac-method-used" aria-live="polite"></div>
        <div id="hvac40Summary" class="hvac-40-summary" hidden></div>'''

          if old_note in text:
              text = text.replace(old_note, selector, 1)
          elif 'class="heating-type-selector"' not in text:
              raise SystemExit('Expected HVAC description was not found.')

          if '/* STREAMLINED-PHONE-HVAC */' not in text:
              css = '''

/* STREAMLINED-PHONE-HVAC */
.heating-type-selector{display:grid;gap:8px;margin:0 0 10px;}
.heating-type-choice{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:9px;width:100%;min-height:48px;border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;background:#fff;color:#111827;font-size:16px;font-weight:800;line-height:1.25;text-align:left;cursor:pointer;}
.heating-type-choice.selected{border:2px solid var(--green);padding:7px 9px;background:#f0fdf4;color:#14532d;}
.heating-type-check{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border:2px solid #22a447;border-radius:8px;background:#f7fff9;color:var(--green);font-family:"Segoe UI Symbol",Arial,sans-serif;font-size:21px;font-weight:900;}
.heating-type-choice:not(.selected) .heating-type-check{color:transparent;}
.hvac-method-used,.hvac-40-summary{margin:0 0 8px;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:900;line-height:1.3;}
.hvac-method-used{background:#e8eefc;color:#1e3a8a;}
.hvac-40-summary{border:1px solid #d1fae5;background:#f0fdf4;color:#14532d;}
.hvac-40-summary[hidden]{display:none!important;}
'''
              text = text.replace('</style>', css + '\n</style>', 1)

          replacement = '''let heatingType = (() => {
  try {
    const saved = localStorage.getItem("loadcalcpro_phone_heating_type");
    return ["central","space","heatpump"].includes(saved) ? saved : "central";
  } catch(e) {
    return "central";
  }
})();

function setHeatingType(type){
  heatingType = ["central","space","heatpump"].includes(type) ? type : "central";
  try { localStorage.setItem("loadcalcpro_phone_heating_type", heatingType); } catch(e) {}
  calculate();
}

function installedHeatingQuantity(){
  return positiveQuantity("q38") + positiveQuantity("q40");
}

function heatingFactor(){
  if(heatingType === "space" && installedHeatingQuantity() >= 4) return 0.40;
  return 0.65;
}

function updateHeatingSelector(){
  document.querySelectorAll(".heating-type-choice").forEach(button => {
    const selected = button.dataset.heatingType === heatingType;
    button.classList.toggle("selected", selected);
    button.setAttribute("aria-checked", selected ? "true" : "false");
    const check = button.querySelector(".heating-type-check");
    if(check) check.textContent = selected ? "✓" : "";
  });

  const factor = heatingFactor();
  const qty = installedHeatingQuantity();
  const method = document.getElementById("hvacMethodUsed");
  const summary = document.getElementById("hvac40Summary");

  if(method){
    if(heatingType === "heatpump"){
      method.textContent = "Method used: Heat pump compressor — 100% plus supplemental heat — 65%";
    }else if(heatingType === "space" && qty >= 4){
      method.textContent = "Method used: Four or more separately controlled units — 40%";
    }else if(heatingType === "space"){
      method.textContent = "Method used: Fewer than four separately controlled units — 65%";
    }else{
      method.textContent = "Method used: Central electric heat — 65%";
    }
  }

  if(summary){
    const show = heatingType === "space" && qty >= 4;
    summary.hidden = !show;
    summary.textContent = show ? "Heat at 40% — " + qty + " units" : "";
  }
}

function remainingRowVA(row){
  const remaining = Math.max(positiveQuantity("q" + row) - managedQuantity(row), 0);
  return remaining * numberValue("v" + row);
}

function hvacLoadCalculation(){
  const ac1Service = rowVA(37);
  const heat1Service = rowVA(38);
  const ac2Service = rowVA(39);
  const heat2Service = rowVA(40);

  const ac1Generator = remainingRowVA(37);
  const heat1Generator = remainingRowVA(38);
  const ac2Generator = remainingRowVA(39);
  const heat2Generator = remainingRowVA(40);

  const serviceAC = ac1Service + ac2Service;
  const generatorAC = ac1Generator + ac2Generator;
  const factor = heatingFactor();
  const serviceHeat = (heat1Service + heat2Service) * factor;
  const generatorHeat = (heat1Generator + heat2Generator) * factor;

  let serviceHVAC;
  let generatorHVAC;
  let serviceHeatControls;
  let generatorHeatControls;

  if(heatingType === "heatpump"){
    serviceHVAC = serviceAC + serviceHeat;
    generatorHVAC = generatorAC + generatorHeat;
    serviceHeatControls = true;
    generatorHeatControls = true;
  }else{
    serviceHeatControls = serviceHeat >= serviceAC;
    generatorHeatControls = generatorHeat >= generatorAC;
    serviceHVAC = Math.max(serviceAC, serviceHeat);
    generatorHVAC = Math.max(generatorAC, generatorHeat);
  }

  setOutput("e37", heatingType === "heatpump" || !serviceHeatControls ? ac1Service : 0);
  setOutput("e38", serviceHeatControls ? heat1Service * factor : 0);
  setOutput("e39", heatingType === "heatpump" || !serviceHeatControls ? ac2Service : 0);
  setOutput("e40", serviceHeatControls ? heat2Service * factor : 0);

  setOutput("f37", heatingType === "heatpump" || !generatorHeatControls ? ac1Generator : 0);
  setOutput("f38", generatorHeatControls ? heat1Generator * factor : 0);
  setOutput("f39", heatingType === "heatpump" || !generatorHeatControls ? ac2Generator : 0);
  setOutput("f40", generatorHeatControls ? heat2Generator * factor : 0);

  updateHeatingSelector();

  return {
    service:serviceHVAC,
    generator:generatorHVAC,
    serviceAC:serviceAC,
    generatorAC:generatorAC,
    serviceHeating:serviceHeat,
    generatorHeating:generatorHeat,
    heatingType:heatingType,
    heatingFactor:factor
  };
}

function continuousLoadCalculation(){'''

          pattern = r'function calculateHeatingDemand\([\s\S]*?function continuousLoadCalculation\(\)\{'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1 and 'function installedHeatingQuantity()' not in text:
              raise SystemExit('Existing HVAC calculation block was not found.')

          path.write_text(text, encoding='utf-8')

      - name: Commit phone update and remove one-time workflow
        run: |
          rm .github/workflows/apply-nec-hvac-selector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html .github/workflows/apply-nec-hvac-selector.yml
          git commit -m "Streamline phone HVAC selector and calculation"
          git push
