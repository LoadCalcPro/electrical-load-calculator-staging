name: Apply phone HVAC selector and 40 percent controls

on:
  push:
    paths:
      - '.github/workflows/apply-nec-hvac-selector.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch phone calculator
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          marker = '<!-- PHONE-HVAC-SELECTOR-V3 -->'
          if marker in text:
              print('Phone HVAC selector V3 is already installed.')
              raise SystemExit(0)

          old_note = '''        <p class="section-note">
          The calculator uses the larger of the air-conditioning
          load or the calculated heating load. Four or more heating
          units are calculated at 40 percent.
        </p>'''

          selector = '''        <p class="section-note">
          Select the type of electric heating system. Only one option can be selected.
        </p>

        <!-- PHONE-HVAC-SELECTOR-V3 -->
        <div class="phone-heating-selector" role="radiogroup" aria-label="Heating system type">
          <button type="button" class="phone-heating-choice selected" data-mode="central" role="radio" aria-checked="true">
            <span class="phone-heating-check">✓</span>
            <span>Central Electric Heat</span>
          </button>
          <button type="button" class="phone-heating-choice" data-mode="space" role="radio" aria-checked="false">
            <span class="phone-heating-check"></span>
            <span>Electric Space-Heating Units</span>
          </button>
          <button type="button" class="phone-heating-choice" data-mode="heatpump" role="radio" aria-checked="false">
            <span class="phone-heating-check"></span>
            <span>Heat Pump with Supplemental Heat</span>
          </button>
        </div>
        <div id="phoneHeatingMethod" class="phone-heating-method">Method used: Central electric heat — 65%</div>'''

          if old_note not in text:
              raise SystemExit('The expected HVAC description was not found. The phone file was not changed.')
          text = text.replace(old_note, selector, 1)

          css = r'''

/* PHONE HVAC SELECTOR V3 */
.phone-heating-selector{display:grid;gap:8px;margin:0 0 9px}
.phone-heating-choice{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;gap:9px;width:100%;min-height:50px;border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;background:#fff;color:#111827;font-size:17px;font-weight:800;line-height:1.25;text-align:left;cursor:pointer}
.phone-heating-choice.selected{border:2px solid var(--green);padding:7px 9px;background:#f0fdf4;color:#14532d}
.phone-heating-check{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:2px solid #22a447;border-radius:8px;background:#f7fff9;color:var(--green);font-family:"Segoe UI Symbol",Arial,sans-serif;font-size:22px;font-weight:900}
.phone-heating-choice:not(.selected) .phone-heating-check{color:transparent}
.phone-heating-method{margin:0 0 12px;border-radius:8px;padding:9px 10px;background:#e8eefc;color:#1e3a8a;font-size:15px;font-weight:900;line-height:1.3}
body.phone-space-40 #m38,body.phone-space-40 #mq38,body.phone-space-40 #m40,body.phone-space-40 #mq40{display:none!important}
body:not(.phone-space-40) #m41,body:not(.phone-space-40) #mq41{pointer-events:none;opacity:.45}
'''
          text = text.replace('</style>', css + '\n</style>', 1)

          script = r'''

<script>
(function(){
  'use strict';

  const MODE_KEY = 'loadcalcpro_phone_heating_mode_v3';
  let mode = 'central';
  let managed40 = 0;

  try{
    const saved = localStorage.getItem(MODE_KEY);
    if(['central','space','heatpump'].includes(saved)) mode = saved;
  }catch(e){}

  function heatQty(){ return positiveQuantity('q38') + positiveQuantity('q40'); }
  function heatRaw(){ return rowVA(38) + rowVA(40); }
  function acRaw(){ return rowVA(37) + rowVA(39); }
  function isForty(){ return mode === 'space' && heatQty() >= 4; }

  function clampManaged40(){
    managed40 = Math.max(0, Math.min(Math.floor(Number(managed40) || 0), heatQty()));
  }

  function update40Control(){
    clampManaged40();
    const check = document.getElementById('m41');
    const qty = document.getElementById('mq41');
    if(check){
      check.textContent = managed40 > 0 ? '✓' : '';
      check.classList.toggle('checked', managed40 > 0);
      check.setAttribute('aria-pressed', managed40 > 0 ? 'true' : 'false');
    }
    if(qty){
      qty.textContent = String(managed40);
      qty.classList.toggle('show', managed40 > 0);
    }
  }

  function updateModeUI(){
    document.querySelectorAll('.phone-heating-choice').forEach(function(button){
      const selected = button.dataset.mode === mode;
      button.classList.toggle('selected', selected);
      button.setAttribute('aria-checked', selected ? 'true' : 'false');
      const mark = button.querySelector('.phone-heating-check');
      if(mark) mark.textContent = selected ? '✓' : '';
    });

    const forty = isForty();
    document.body.classList.toggle('phone-space-40', forty);

    const method = document.getElementById('phoneHeatingMethod');
    if(method){
      if(mode === 'heatpump') method.textContent = 'Method used: Heat pump compressor at 100% plus supplemental electric heat at 65%';
      else if(forty) method.textContent = 'Method used: Four or more separately controlled units — 40%';
      else if(mode === 'space') method.textContent = 'Method used: Fewer than four separately controlled units — 65%';
      else method.textContent = 'Method used: Central electric heat — 65%';
    }

    const row41 = document.getElementById('q41')?.closest('.load-row');
    if(row41) row41.style.display = forty ? '' : 'none';
    update40Control();
  }

  function generatorHeatAfterManagement(rawHeat){
    if(!isForty()){
      const remaining38 = Math.max(positiveQuantity('q38') - managedQuantity(38), 0) * numberValue('v38');
      const remaining40 = Math.max(positiveQuantity('q40') - managedQuantity(40), 0) * numberValue('v40');
      return remaining38 + remaining40;
    }

    clampManaged40();
    const qty = heatQty();
    if(qty <= 0) return 0;
    const remainingFraction = (qty - managed40) / qty;
    return rawHeat * remainingFraction;
  }

  window.hvacLoadCalculation = function(){
    const serviceAC = acRaw();
    const serviceHeatRaw = heatRaw();
    const totalUnits = heatQty();

    let serviceHeating;
    let serviceHVAC;
    let factor;

    if(mode === 'heatpump'){
      factor = 0.65;
      serviceHeating = serviceAC + serviceHeatRaw * factor;
      serviceHVAC = serviceHeating;
    }else{
      factor = isForty() ? 0.40 : 0.65;
      serviceHeating = serviceHeatRaw * factor;
      serviceHVAC = Math.max(serviceAC, serviceHeating);
    }

    const generatorAC = Math.max(positiveQuantity('q37') - managedQuantity(37), 0) * numberValue('v37') + Math.max(positiveQuantity('q39') - managedQuantity(39), 0) * numberValue('v39');
    const generatorHeatRaw = generatorHeatAfterManagement(serviceHeatRaw);
    const generatorHeating = mode === 'heatpump' ? generatorAC + generatorHeatRaw * 0.65 : generatorHeatRaw * factor;
    const generatorHVAC = mode === 'heatpump' ? generatorHeating : Math.max(generatorAC, generatorHeating);

    const serviceHeatControls = mode === 'heatpump' || serviceHeating >= serviceAC;
    const generatorHeatControls = mode === 'heatpump' || generatorHeating >= generatorAC;

    setOutput('e37', mode === 'heatpump' ? rowVA(37) : (!serviceHeatControls ? rowVA(37) : 0));
    setOutput('e38', serviceHeatControls ? rowVA(38) * factor : 0);
    setOutput('e39', mode === 'heatpump' ? rowVA(39) : (!serviceHeatControls ? rowVA(39) : 0));
    setOutput('e40', serviceHeatControls ? rowVA(40) * factor : 0);
    setOutput('e41', isForty() ? serviceHeatRaw * 0.40 : 0);

    setOutput('f37', mode === 'heatpump' ? Math.max(positiveQuantity('q37') - managedQuantity(37), 0) * numberValue('v37') : (!generatorHeatControls ? Math.max(positiveQuantity('q37') - managedQuantity(37), 0) * numberValue('v37') : 0));
    setOutput('f38', !isForty() && generatorHeatControls ? Math.max(positiveQuantity('q38') - managedQuantity(38), 0) * numberValue('v38') * factor : 0);
    setOutput('f39', mode === 'heatpump' ? Math.max(positiveQuantity('q39') - managedQuantity(39), 0) * numberValue('v39') : (!generatorHeatControls ? Math.max(positiveQuantity('q39') - managedQuantity(39), 0) * numberValue('v39') : 0));
    setOutput('f40', !isForty() && generatorHeatControls ? Math.max(positiveQuantity('q40') - managedQuantity(40), 0) * numberValue('v40') * factor : 0);
    setOutput('f41', isForty() && generatorHeatControls ? generatorHeatRaw * 0.40 : 0);

    const q41 = document.getElementById('q41');
    const v41 = document.getElementById('v41');
    if(q41) q41.value = isForty() ? totalUnits : '';
    if(v41) v41.value = isForty() ? Math.round(serviceHeatRaw * 0.40) : '';

    updateModeUI();

    return {service:serviceHVAC,generator:generatorHVAC,serviceAC:serviceAC,generatorAC:generatorAC,serviceHeating:serviceHeating,generatorHeating:generatorHeating};
  };

  function connect(){
    document.querySelectorAll('.phone-heating-choice').forEach(function(button){
      button.addEventListener('click', function(){
        mode = button.dataset.mode || 'central';
        managed40 = 0;
        try{ localStorage.setItem(MODE_KEY, mode); }catch(e){}
        updateModeUI();
        calculate();
      });
    });

    const check = document.getElementById('m41');
    const qty = document.getElementById('mq41');
    if(check){
      check.onclick = function(event){
        event.preventDefault();
        event.stopImmediatePropagation();
        if(!isForty()) return;
        managed40 = managed40 > 0 ? 0 : heatQty();
        update40Control();
        calculate();
      };
    }
    if(qty){
      qty.onclick = function(event){
        event.preventDefault();
        event.stopImmediatePropagation();
        if(!isForty()) return;
        managed40 = managed40 <= 1 ? 0 : managed40 - 1;
        update40Control();
        calculate();
      };
    }

    ['q38','v38','q40','v40'].forEach(function(id){
      const input = document.getElementById(id);
      if(input) input.addEventListener('input', function(){ clampManaged40(); updateModeUI(); });
    });

    updateModeUI();
    calculate();
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', connect);
  else connect();
})();
</script>
'''

          text = text.replace('</body>', script + '\n</body>', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit phone file and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-nec-hvac-selector.yml
          git add generator-phone-staging-v1.0.html .github/workflows/apply-nec-hvac-selector.yml
          git commit -m "Add phone heating selector and managed 40 percent row"
          git push
