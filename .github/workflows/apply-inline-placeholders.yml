name: Apply Version 2 mobile input design

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update generator mobile inputs
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/apply_v2.py
          python /tmp/apply_v2.py

      - name: Commit calculator update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Create Version 2 mobile generator input layout"
          git push
