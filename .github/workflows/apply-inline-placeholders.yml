name: Remove repeated load output boxes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide repeated row and section output boxes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          marker = '/* Remove repeated per-row load output boxes */'
          css = '''
          /* Remove repeated per-row load output boxes */
          .row-output,
          .summary-strip {
            display: none !important;
          }
          '''

          if marker not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit calculator change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove repeated service and generator load boxes"
          git push
