name: Apply clean generator redesign

on:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite mobile calculator layout
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/rewrite_generator.py
          python /tmp/rewrite_generator.py
      - name: Commit calculator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Simplify generator layout and restore HVAC 40 percent display"
          git push
