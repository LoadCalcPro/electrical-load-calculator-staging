name: Restore clean calculator and remove repeated outputs

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good calculator and apply final cleanup
        shell: bash
        run: |
          git show 6b10aad3281ce931da95b827a1fd65f0a4ee80e1:generator-phone-staging-v1.0.html > generator-phone-staging-v1.0.html

          python - <<'PY'
          from pathlib import Path

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          css = '''
          /* Final clean mobile layout */
          .row-output,
          .summary-strip {
            display:none !important;
          }
          .load-row {
            padding:10px 0;
          }
          .load-inputs,
          .load-inputs.inline-load-row {
            grid-template-columns:90px minmax(0,1fr) 48px;
            align-items:center;
            gap:9px;
          }
          .general-load-inputs,
          .general-load-inputs.inline-load-row {
            grid-template-columns:minmax(0,1fr);
          }
          .input-block input,
          .field input,
          .field select {
            min-height:48px;
            font-size:18px !important;
            text-align:left !important;
          }
          .managed-row {
            display:none !important;
          }
          '''

          if '/* Final clean mobile layout */' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          js = '''
          <script>
          (function(){
            function finishLayout(){
              document.querySelectorAll('.load-row').forEach(function(row){
                var inputs = row.querySelector('.load-inputs');
                var managed = row.querySelector('.managed-controls');
                if(inputs && managed && !inputs.contains(managed)){
                  managed.classList.add('inline-managed-controls');
                  inputs.classList.add('inline-load-row');
                  inputs.appendChild(managed);
                }
              });

              var voltage = Array.from(document.querySelectorAll('main .card')).find(function(card){
                var h = card.querySelector('.card-heading');
                return h && h.textContent.replace(/\\s+/g,' ').trim() === 'Service Voltage';
              });
              var general = Array.from(document.querySelectorAll('main .card')).find(function(card){
                var h = card.querySelector('.card-heading');
                return h && h.textContent.replace(/\\s+/g,' ').trim() === 'General Loads';
              });
              if(voltage && general && voltage.nextElementSibling !== general){
                general.parentNode.insertBefore(voltage, general);
              }
            }
            if(document.readyState === 'loading'){
              document.addEventListener('DOMContentLoaded', finishLayout);
            }else{
              finishLayout();
            }
            new MutationObserver(finishLayout).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>
          '''

          if 'function finishLayout()' not in text:
              text = text.replace('</body>', js + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit restored calculator file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore clean calculator and remove repeated load boxes"
          git push
