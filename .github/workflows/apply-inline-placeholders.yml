name: Remove per-row load VA displays

on:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide all per-row and section load VA boxes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* Remove all repeated Service Load VA and Generator Load VA displays */'
          css = '''

          /* Remove all repeated Service Load VA and Generator Load VA displays */
          .row-output,
          .summary-strip {
            display: none !important;
          }
          '''

          if marker not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit calculator update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove repeated service and generator VA boxes"
          git push
