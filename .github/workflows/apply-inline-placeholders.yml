name: Remove repeated load output boxes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove repeated output elements from calculator HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          # Permanently remove all per-row Service Load VA / Generator Load VA
          # containers and the section summary strips from the HTML.
          text = re.sub(
              r'\s*<div class="row-output">.*?</div>\s*</div>',
              '',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'\s*<div class="summary-strip">.*?</div>\s*</div>',
              '',
              text,
              flags=re.S,
          )

          # Dynamic appliance rows were creating the same boxes in JavaScript.
          text = re.sub(
              r'\n\s*const outputRow =\s*document\.createElement\("div"\);.*?row\.appendChild\(outputRow\);',
              '',
              text,
              flags=re.S,
          )

          # Defensive CSS ensures no old or cached dynamically generated boxes display.
          marker = '/* Permanent repeated-output removal */'
          css = '''
          /* Permanent repeated-output removal */
          .row-output,
          .summary-strip {
            display: none !important;
          }
          '''
          if marker not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit calculator file directly
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove repeated load output boxes from calculator HTML"
          git push
