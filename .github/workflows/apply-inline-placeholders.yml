name: Apply inline input placeholders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update mobile calculator inputs
        shell: bash
        run: |
          echo '' | base64 --decode > /tmp/apply_placeholders.py
          python /tmp/apply_placeholders.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Move calculator input descriptions inside fields"
          git push
