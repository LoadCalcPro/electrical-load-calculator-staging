name: Load phone reset and HVAC 40 percent repair

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add repair script to phone calculator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="phone-reset-hvac40-fix.js"></script>'

          if tag not in text:
              text = text.replace('</body>', tag + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit calculator repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix phone clear function and restore HVAC 40 percent row"
          git push
