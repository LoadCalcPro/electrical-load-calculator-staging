name: Apply inline input placeholders

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mobile calculator inputs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          css = r'''

/* Mobile input descriptions now appear inside the boxes */
.input-block label{
  display:none;
}

.input-block input,
.input-block select{
  text-align:left;
  font-size:18px;
  padding-left:10px;
}

.input-block input::placeholder{
  color:#9ca3af;
  opacity:1;
  font-size:18px;
  font-weight:400;
}
'''

          js = r'''
<script>
(function(){
  function applyInlineInputPlaceholders(root){
    const scope = root && root.querySelectorAll ? root : document;
    scope.querySelectorAll('.input-block').forEach(function(block){
      const label = block.querySelector('label');
      const input = block.querySelector('input');
      if(!label || !input) return;

      const placeholderText = label.textContent.replace(/\s+/g, ' ').trim();
      if(placeholderText && !input.getAttribute('placeholder')){
        input.setAttribute('placeholder', placeholderText);
      }
    });
  }

  function initializeInlinePlaceholders(){
    applyInlineInputPlaceholders(document);

    const observer = new MutationObserver(function(mutations){
      mutations.forEach(function(mutation){
        mutation.addedNodes.forEach(function(node){
          if(node.nodeType === 1){
            applyInlineInputPlaceholders(node);
            if(node.matches && node.matches('.input-block')){
              applyInlineInputPlaceholders(node.parentElement || node);
            }
          }
        });
      });
    });

    observer.observe(document.body, {childList:true, subtree:true});
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initializeInlinePlaceholders);
  }else{
    initializeInlinePlaceholders();
  }
})();
</script>
'''

          if 'Mobile input descriptions now appear inside the boxes' not in text:
              text = text.replace('</style>', css + '\n</style>', 1)

          if 'initializeInlinePlaceholders' not in text:
              text = text.replace('</body>', js + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git commit -m "Move calculator input descriptions inside fields" || exit 0
          git push
