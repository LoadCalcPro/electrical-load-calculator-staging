name: Repair calculator HTML and remove output boxes

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Repair calculator file and remove repeated outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from bs4 import BeautifulSoup

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          # Stop JavaScript from creating per-appliance result boxes.
          text = re.sub(
              r'\n\s*const outputRow\s*=\s*document\.createElement\("div"\);.*?\n\s*row\.appendChild\(outputRow\);',
              '',
              text,
              flags=re.S,
          )

          # Parse and repair the HTML, then permanently remove all repeated
          # per-row and section Service/Generator VA output containers.
          soup = BeautifulSoup(text, 'html.parser')
          for node in soup.select('.row-output, .summary-strip, .output-box'):
              node.decompose()

          # Keep a defensive rule for any future dynamically added output blocks.
          style = soup.find('style')
          marker = 'Permanent repeated-output removal'
          if style and marker not in style.get_text():
              style.append('''\n/* Permanent repeated-output removal */\n.row-output,\n.summary-strip,\n.output-box {\n  display: none !important;\n}\n''')

          path.write_text(str(soup), encoding='utf-8')
          PY

      - name: Commit calculator HTML directly
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Repair HTML and permanently remove repeated load boxes"
          git push
