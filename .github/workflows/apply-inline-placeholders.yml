name: Darken managed checkbox borders

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-inline-placeholders.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make managed checkboxes easier to see
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('generator-phone-staging-v1.0.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'border:1px solid #86efac;\n  border-radius:8px;\n  background:#ffffff;',
              'border:2px solid #22a447;\n  border-radius:8px;\n  background:#f7fff9;\n  box-shadow:0 0 0 1px rgba(21,128,61,.10);',
              1,
          )

          text = text.replace(
              '.managed-check.checked{\n  border-color:var(--green);\n  background:#dcfce7;\n}',
              '.managed-check.checked{\n  border-color:#0f6f32;\n  background:#dcfce7;\n  box-shadow:0 0 0 1px rgba(15,111,50,.18);\n}',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit checkbox styling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Darken managed checkbox outlines"
          git push
