name: Fix mobile general loads v2

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-general-loads-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update General Loads layout
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('generator-phone-staging-v1.0.html')
          s = p.read_text(encoding='utf-8')

          start = s.index('        General Loads\n')
          end = s.index('        Appliance Loads\n', start)
          section = s[start:end]

          section = section.replace('            Square Footage\n', '            Square Footage at 3 VA/ft²\n', 1)
          section = section.replace('            Small Appliance Circuits\n', '            Small Appliance Circuits at 1,500 VA each\n', 1)
          section = section.replace('            Laundry Circuit\n', '            Laundry Circuit at 1,500 VA each\n', 1)

          for fid in ('v5', 'v6', 'v7'):
              pattern = rf'\n\s*<div class="input-block">(?:(?!<div class="input-block">).)*?id="{fid}".*?</div>'
              section, n = re.subn(pattern, '', section, count=1, flags=re.S)
              print(fid, 'removed', n)

          section = section.replace('class="load-inputs"', 'class="load-inputs general-load-inputs"')

          marker = '<div class="summary-label">\n              Service General VA'
          pos = section.find(marker)
          if pos != -1:
              strip_start = section.rfind('<div class="summary-strip">', 0, pos)
              if strip_start == -1:
                  raise SystemExit('summary start not found')
              # Find the closing summary-strip div by counting nested divs.
              i = strip_start
              depth = 0
              while i < len(section):
                  next_open = section.find('<div', i)
                  next_close = section.find('</div>', i)
                  if next_close == -1:
                      raise SystemExit('summary end not found')
                  if next_open != -1 and next_open < next_close:
                      depth += 1
                      i = next_open + 4
                  else:
                      depth -= 1
                      i = next_close + 6
                      if depth == 0:
                          section = section[:strip_start] + section[i:]
                          break

          s = s[:start] + section + s[end:]

          css = '.load-inputs{\n  display:grid;\n  grid-template-columns:minmax(0,1fr) minmax(0,1fr);\n  gap:9px;\n}\n'
          if '.general-load-inputs{' not in s:
              s = s.replace(css, css + '\n.general-load-inputs{\n  grid-template-columns:1fr;\n}\n', 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          git diff --cached --quiet && exit 0
          git commit -m "Simplify mobile General Loads section"
          git push
