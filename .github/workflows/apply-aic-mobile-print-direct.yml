name: Apply AIC mobile and print update directly

on:
  push:
    paths:
      - '.github/workflows/apply-aic-mobile-print-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update staging AIC file
        run: |
          echo '' | base64 -d > /tmp/update_aic.py
          python /tmp/update_aic.py
      - name: Commit staging AIC update
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          git commit -m "Improve staging AIC mobile and print layout"
          git push
