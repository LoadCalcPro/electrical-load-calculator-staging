name: One-time clean AIC print report

on:
  push:
    paths:
      - '.github/workflows/one-time-aic-mobile-print-preview.yml'
      - '.github/scripts/apply_clean_aic_report.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply clean AIC print report
        run: python .github/scripts/apply_clean_aic_report.py

      - name: Commit staging report update
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          git commit -m "Create clean AIC engineering print report [skip ci]"
          git push
