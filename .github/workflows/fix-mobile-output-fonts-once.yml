name: Fix mobile output fonts once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-mobile-output-fonts-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update output alignment and font sizes
        shell: python
        run: |
          from pathlib import Path
          p = Path('generator-phone-staging-v1.0.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* mobile readable output text */'
          if marker not in s:
              css = '''\n\n/* mobile readable output text */\n.output-box{\n  text-align:left;\n}\n\n.output-label{\n  font-size:18px;\n  line-height:1.25;\n  text-align:left;\n  text-transform:none;\n}\n\n.output-value{\n  font-size:18px;\n  line-height:1.25;\n  text-align:left;\n}\n\n.summary-box .summary-label{\n  font-size:18px;\n  line-height:1.25;\n  text-align:left;\n  text-transform:none;\n}\n\n.summary-box .summary-value{\n  font-size:18px;\n  line-height:1.25;\n  text-align:left;\n}\n'''
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generator-phone-staging-v1.0.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Make service and generator load text readable"
            git push
          fi
