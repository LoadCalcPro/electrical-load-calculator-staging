name: One-time staging AIC restore modal update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-aic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update staging AIC restore dialog
        run: python .github/scripts/update_aic_restore_modal.py

      - name: Commit staging-only change
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aic_calculator.html
          git commit -m "Improve staging AIC saved calculation dialog"
          git push
