<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCR comparison lab</title><style>body{font:14px Arial,sans-serif;margin:24px;background:#f4f7fa;color:#182c40}h1{font-size:24px}section{background:white;padding:16px;border:1px solid #ccd7e0;border-radius:6px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}canvas{width:100%;height:auto;max-height:420px;object-fit:contain}textarea{box-sizing:border-box;width:100%;height:300px;font:14px/1.4 Arial}button,input,select{margin:5px}button{padding:8px}label{display:inline-block} @media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>OCR comparison lab</h1><p>Experimental staging tool. The original drawing is never modified.</p><section><input id="file" type="file" accept="image/*"><label>Resolution <select id="scale"><option>1</option><option selected>2</option><option>3</option></select>×</label><label>Contrast <input id="contrast" type="range" min="1" max="3" step=".1" value="1.5"></label><label><input id="denoise" type="checkbox" checked>Noise reduction</label><label><input id="sharp" type="checkbox" checked>Sharpen</label><label><input id="binary" type="checkbox">Adaptive black and white</label><button id="run" disabled>Compare OCR</button><p id="status" role="status">Waiting for drawing…</p></section><main><section><h2>Standard OCR</h2><canvas id="original"></canvas><p id="standardStats"></p><textarea id="standard" aria-label="Standard recognized text"></textarea></section><section><h2>Enhanced OCR</h2><canvas id="enhanced"></canvas><p id="enhancedStats"></p><textarea id="result" aria-label="Enhanced recognized text"></textarea></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id);let source=null;
async function load(src){const im=new Image();im.src=src;await im.decode();source=im;const c=$('original');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);$('run').disabled=false;$('status').textContent='Drawing loaded. Adjust settings and compare.';}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===window.opener&&e.data?.type==='ocr-test-image')load(e.data.src).catch(err=>$('status').textContent=err.message);});if(window.opener)window.opener.postMessage({type:'ocr-test-ready'},location.origin);
$('file').onchange=()=>{const f=$('file').files[0];if(f){const u=URL.createObjectURL(f);load(u).catch(e=>$('status').textContent=e.message).finally(()=>URL.revokeObjectURL(u));}};
function enhance(){const c=$('enhanced'),factor=Math.min(Number($('scale').value),Math.sqrt(16000000/(source.naturalWidth*source.naturalHeight)));c.width=Math.max(1,Math.round(source.naturalWidth*factor));c.height=Math.max(1,Math.round(source.naturalHeight*factor));const ctx=c.getContext('2d');ctx.drawImage(source,0,0,c.width,c.height);const im=ctx.getImageData(0,0,c.width,c.height),d=im.data,w=c.width,h=c.height,n=w*h,g=new Float32Array(n);for(let i=0;i<n;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];const filtered=g.slice();if($('denoise').checked){for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;const a=[g[i-w],g[i-1],g[i],g[i+1],g[i+w]].sort((a,b)=>a-b);filtered[i]=a[2];}}const contrast=Number($('contrast').value),sharp=$('sharp').checked,binary=$('binary').checked;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x,v=filtered[i],avg=(filtered[y*w+Math.max(0,x-1)]+filtered[y*w+Math.min(w-1,x+1)]+filtered[Math.max(0,y-1)*w+x]+filtered[Math.min(h-1,y+1)*w+x])/4;let z=(v-128)*contrast+128+(sharp?(v-avg)*.8:0);if(binary){const r=12,local=(filtered[y*w+Math.max(0,x-r)]+filtered[y*w+Math.min(w-1,x+r)]+filtered[Math.max(0,y-r)*w+x]+filtered[Math.min(h-1,y+r)*w+x])/4;z=v<local-12?0:255;}d[i*4]=d[i*4+1]=d[i*4+2]=Math.max(0,Math.min(255,z));}ctx.putImageData(im,0,0);}
$('run').onclick=async()=>{if(!source)return;$('run').disabled=true;try{enhance();for(const [name,input,out,stats] of [['Standard',source.src,'standard','standardStats'],['Enhanced',$('enhanced'),'result','enhancedStats']]){$('status').textContent=name+' OCR running…';const r=await Tesseract.recognize(input,'eng',{logger:m=>{$('status').textContent=name+': '+m.status+' '+Math.round((m.progress||0)*100)+'%';}});$(out).value=r.data.text;$(stats).textContent='Engine confidence: '+Math.round(r.data.confidence)+'% (not verified accuracy)';}$('status').textContent='Comparison complete. Check both results against the drawing.';}catch(e){$('status').textContent='OCR failed: '+e.message;}finally{$('run').disabled=false;}};
</script></html>
